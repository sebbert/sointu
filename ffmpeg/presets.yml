# Default encoding presets. A song gets a copy of these when its first sample
# is imported, and keeps them as its own; samples refer to them by name.
# Users can add their own defaults in <config dir>/sointu/encoding-presets.yml
# in the same format; a user preset with the same name as a built-in one
# replaces it.
#
# format is the ffmpeg output format (-f); args are the ffmpeg output
# arguments. The number of channels (-ac) is added from the buffer. An empty
# format stores the sample as it is.
- name: Passthrough
- name: WAV 16-bit
  format: wav
  args: [-c:a, pcm_s16le]
- name: FLAC
  format: flac
  args: [-c:a, flac, -compression_level, "12"]
- name: Opus 24k
  format: ogg
  args: [-c:a, libopus, -b:a, 24k]
- name: Opus 32k
  format: ogg
  args: [-c:a, libopus, -b:a, 32k]
- name: Opus 64k
  format: ogg
  args: [-c:a, libopus, -b:a, 64k]
- name: Opus 96k
  format: ogg
  args: [-c:a, libopus, -b:a, 96k]
- name: MP3 128k
  format: mp3
  args: [-c:a, libmp3lame, -b:a, 128k]
