# Default encoding presets. A song gets a copy of these when its first sample
# is imported, and keeps them as its own; samples refer to them by name.
# Users can add their own defaults in <config dir>/sointu/encoding-presets.yml
# in the same format; a user preset with the same name as a built-in one
# replaces it.
#
# format is the ffmpeg output format (-f); args are the ffmpeg output
# arguments. -fflags +bitexact and clearing the encoder tag keep ffmpeg's
# name and version out of the file, saving about 40 bytes per sample. The number of channels (-ac) is added from the buffer. An empty
# format stores the sample as it is.
- name: Passthrough
- name: Opus 24k
  format: ogg
  args: [-c:a, libopus, -b:a, 24k, -fflags, +bitexact, "-metadata:s:a:0", encoder=]
- name: Opus 32k
  format: ogg
  args: [-c:a, libopus, -b:a, 32k, -fflags, +bitexact, "-metadata:s:a:0", encoder=]
- name: Opus 64k
  format: ogg
  args: [-c:a, libopus, -b:a, 64k, -fflags, +bitexact, "-metadata:s:a:0", encoder=]
- name: Opus 96k
  format: ogg
  args: [-c:a, libopus, -b:a, 96k, -fflags, +bitexact, "-metadata:s:a:0", encoder=]
