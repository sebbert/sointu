patch:
    - name: Club 909 kick
      comment: 'A 909-style kick: a sine that sweeps down to the note. Suggested notes: G-1 to A-1. To route it to the drum bus of Global mastering 2 drumbus, change the last unit from out to aux, channel 6. Curved envelopes and softclip: Go synth and wasm player only.'
      numvoices: 1
      units:
        - type: envelope
          id: 1
          parameters: {attack: 0, curve: 104, decay: 60, gain: 128, release: 60, stereo: 0, sustain: 0}
          comment: 'Pitch sweep: decay is how long it takes'
        - type: send
          id: 2
          parameters: {amount: 80, port: 0, sendpop: 1, stereo: 0, target: 4, voice: 0}
          comment: 'How far above the note the sweep starts: 16 steps are 32 semitones'
        - type: envelope
          id: 3
          parameters: {attack: 0, curve: 80, decay: 74, gain: 128, release: 74, stereo: 0, sustain: 0}
          comment: 'The length of the body: decay, and release for notes released before it ends'
        - type: oscillator
          id: 4
          parameters: {bandlimit: 0, color: 128, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 0, unison: 0}
        - type: mulp
          id: 5
          parameters: {stereo: 0}
        - type: softclip
          id: 6
          parameters: {drive: 12, knee: 64, oversample: 0, stereo: 0}
          comment: 'Saturation: drive flattens the top of the body, which makes it louder at the same peak, and sharpens the click'
        - type: pan
          id: 7
          parameters: {panning: 64, stereo: 0}
        - type: out
          id: 8
          parameters: {gain: 128, stereo: 1}
          comment: The level. For the drum bus, make this an aux unit with channel 6
    - name: Club kick hard
      comment: 'A hard techno kick with a rumble: the kick, driven hard, and behind it its own echoes in 16th notes, low-passed, driven and faded in after each hit. Suggested notes: F-1 to A-1. Hold the note for as long as the rumble should last. To route it to the drum bus of Global mastering 2 drumbus, change the last unit from out to aux, channel 6. Curved envelopes, softclip and ladder: Go synth and wasm player only.'
      numvoices: 1
      units:
        - type: envelope
          id: 9
          parameters: {attack: 0, curve: 104, decay: 62, gain: 128, release: 62, stereo: 0, sustain: 0}
          comment: Pitch sweep
        - type: send
          id: 10
          parameters: {amount: 84, port: 0, sendpop: 1, stereo: 0, target: 12, voice: 0}
          comment: How far above the note the sweep starts
        - type: envelope
          id: 11
          parameters: {attack: 0, curve: 64, decay: 72, gain: 128, release: 72, stereo: 0, sustain: 0}
          comment: The length of the body
        - type: oscillator
          id: 12
          parameters: {bandlimit: 0, color: 128, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 0, unison: 0}
        - type: mulp
          id: 13
          parameters: {stereo: 0}
        - type: softclip
          id: 14
          parameters: {drive: 40, knee: 32, oversample: 0, stereo: 0}
          comment: 'The hardness of the kick: drive, and knee for how square it gets'
        - type: push
          id: 15
          parameters: {stereo: 0}
          comment: The rumble, from a copy of the kick
        - type: delay
          id: 16
          parameters: {damp: 64, dry: 0, feedback: 80, notetracking: 2, pregain: 128, stereo: 0}
          varargs: [12]
          comment: Echoes every 16th note; feedback is how long the rumble rolls on
        - type: ladder
          id: 17
          parameters: {drive: 48, frequency: 11, resonance: 0, stereo: 0}
          comment: 'Only the lows of the echoes, driven: frequency is how dark the rumble is, drive how dense'
        - type: envelope
          id: 18
          parameters: {attack: 66, curve: 0, decay: 0, gain: 64, release: 70, stereo: 0, sustain: 128}
          comment: Fades the rumble in after each kick, so that it stays out of the way of the body, and out when the note is released
        - type: mulp
          id: 19
          parameters: {stereo: 0}
        - type: addp
          id: 20
          parameters: {stereo: 0}
        - type: pan
          id: 21
          parameters: {panning: 64, stereo: 0}
        - type: out
          id: 22
          parameters: {gain: 128, stereo: 1}
          comment: The level. For the drum bus, make this an aux unit with channel 6
    - name: Club 909 snare
      comment: 'A 909-style snare: a sine body with a short pitch drop and band-passed noise. Suggested notes: around F#3; the note tunes the body. To route it to the drum bus of Global mastering 2 drumbus, change the last unit from out to aux, channel 6. Curved envelopes and softclip: Go synth and wasm player only.'
      numvoices: 1
      units:
        - type: envelope
          id: 23
          parameters: {attack: 0, curve: 96, decay: 50, gain: 128, release: 50, stereo: 0, sustain: 0}
          comment: Pitch drop of the body
        - type: send
          id: 24
          parameters: {amount: 72, port: 0, sendpop: 1, stereo: 0, target: 26, voice: 0}
          comment: How far above the note the body starts
        - type: envelope
          id: 25
          parameters: {attack: 0, curve: 96, decay: 64, gain: 128, release: 64, stereo: 0, sustain: 0}
          comment: The length of the body
        - type: oscillator
          id: 26
          parameters: {bandlimit: 0, color: 128, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 0, unison: 0}
          comment: The body; gain is its level against the noise
        - type: mulp
          id: 27
          parameters: {stereo: 0}
        - type: envelope
          id: 28
          parameters: {attack: 0, curve: 80, decay: 68, gain: 128, release: 68, stereo: 0, sustain: 0}
          comment: The length of the noise (snappy)
        - type: noise
          id: 29
          parameters: {gain: 72, shape: 64, stereo: 0}
        - type: mulp
          id: 30
          parameters: {stereo: 0}
        - type: filter
          id: 31
          parameters: {bandpass: 1, frequency: 100, highpass: 0, lowpass: 0, resonance: 128, stereo: 0}
          comment: 'The band of the noise: frequency is its centre'
        - type: addp
          id: 32
          parameters: {stereo: 0}
        - type: softclip
          id: 33
          parameters: {drive: 8, knee: 64, oversample: 0, stereo: 0}
        - type: pan
          id: 34
          parameters: {panning: 64, stereo: 0}
        - type: out
          id: 35
          parameters: {gain: 100, stereo: 1}
          comment: The level. For the drum bus, make this an aux unit with channel 6
    - name: Club 909 clap
      comment: 'A 909-style clap: band-passed noise in four bursts, then a tail. To route it to the drum bus of Global mastering 2 drumbus, change the last unit from out to aux, channel 6. Curved envelopes: Go synth and wasm player only.'
      numvoices: 1
      units:
        - type: envelope
          id: 36
          parameters: {attack: 0, curve: 64, decay: 46, gain: 128, release: 46, stereo: 0, sustain: 0}
          comment: One burst
        - type: delay
          id: 37
          parameters: {damp: 0, dry: 128, feedback: 0, notetracking: 0, pregain: 128, stereo: 0}
          varargs: [485, 970, 1455]
          comment: Repeats the burst three times; the delay times are the gaps, in samples
        - type: envelope
          id: 38
          parameters: {attack: 0, curve: 64, decay: 72, gain: 96, release: 72, stereo: 0, sustain: 0}
          comment: 'The tail: decay is its length, gain its level'
        - type: addp
          id: 39
          parameters: {stereo: 0}
        - type: noise
          id: 40
          parameters: {gain: 128, shape: 64, stereo: 0}
        - type: mulp
          id: 41
          parameters: {stereo: 0}
        - type: filter
          id: 42
          parameters: {bandpass: 1, frequency: 52, highpass: 0, lowpass: 0, resonance: 48, stereo: 0}
          comment: 'The colour of the clap: frequency, and resonance for how narrow'
        - type: pan
          id: 43
          parameters: {panning: 64, stereo: 0}
        - type: out
          id: 44
          parameters: {gain: 118, stereo: 1}
          comment: The level. For the drum bus, make this an aux unit with channel 6
    - name: Club 909 hat closed
      comment: 'A closed hi-hat: frequency modulated square waves and noise, through a low cut and a band-pass. Suggested note: C-5; the note tunes the metal. To route it to the drum bus of Global mastering 2 drumbus, change the last unit from out to aux, channel 6. Curved envelopes: Go synth and wasm player only.'
      numvoices: 1
      units:
        - type: oscillator
          id: 45
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 107, type: 2, unison: 0}
          comment: Modulator
        - type: send
          id: 46
          parameters: {amount: 70, port: 6, sendpop: 1, stereo: 0, target: 47, voice: 0}
          comment: 'How metallic: the amount of frequency modulation'
        - type: oscillator
          id: 47
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 64, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 95, type: 2, unison: 0}
          comment: 'The metal: a square wave, frequency modulated into a dense, inharmonic spectrum'
        - type: noise
          id: 48
          parameters: {gain: 40, shape: 64, stereo: 0}
          comment: The level of the noise against the metal
        - type: addp
          id: 49
          parameters: {stereo: 0}
        - type: envelope
          id: 50
          parameters: {attack: 0, curve: 96, decay: 60, gain: 128, release: 60, stereo: 0, sustain: 0}
          comment: decay is the length
        - type: mulp
          id: 51
          parameters: {stereo: 0}
