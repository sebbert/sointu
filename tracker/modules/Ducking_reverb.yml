modules:
    - id: 1
      name: Reverb
      comment: 'Stereo reverb, wet only: low and high cut, predelay, a diffuser of four steps for the early reflections, and a feedback delay network of 8 lines for the tail. Uses mc units: Go synth and wasm player only.'
      inputs: 2
      params:
        - {name: size, default: 64}
        - {name: decay, default: 90}
        - {name: highs, default: 48}
        - {name: lows, default: 72}
        - {name: predelay, default: 13}
        - {name: mod, default: 24}
        - {name: highcut, default: 98}
        - {name: lowcut, default: 56}
      units:
        - type: mcspread
          parameters: {add: 0, bus: 1, gain: 76, stereo: 1}
          comment: The stereo input on the 8 channels of the bus; gain is the level of the reverb
        - type: mcfilter
          parameters: {bus: 1, frequency: 37, type: 1}
          bind: {frequency: {p: 8, min: 0, max: 85}}
          comment: Low cut
        - type: mcfilter
          parameters: {bus: 1, frequency: 115, type: 0}
          bind: {frequency: {p: 7, min: 72, max: 128}}
          comment: High cut
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 0, size: 204, spread: 0}
          bind: {size: {p: 5, min: 1, max: 2000}}
          comment: 'Predelay: all 8 lines of the same length'
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 1, size: 400, spread: 128}
          bind: {size: {p: 1, min: 100, max: 700}}
          comment: 'Diffuser: each step delays the channels by random amounts up to its size, shuffles and mixes them'
        - type: mcmix
          parameters: {bus: 1, seed: 1, type: 2}
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 0}
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 2, size: 200, spread: 128}
          bind: {size: {p: 1, min: 50, max: 350}}
        - type: mcmix
          parameters: {bus: 1, seed: 2, type: 2}
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 0}
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 3, size: 100, spread: 128}
          bind: {size: {p: 1, min: 25, max: 175}}
        - type: mcmix
          parameters: {bus: 1, seed: 3, type: 2}
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 0}
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 4, size: 50, spread: 128}
          bind: {size: {p: 1, min: 12, max: 88}}
        - type: mcmix
          parameters: {bus: 1, seed: 4, type: 2}
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 0}
        - type: mcsum
          parameters: {bus: 1, gain: 52, stereo: 1, width: 80}
          comment: 'Early reflections: the diffused input'
        - type: mcloop
          parameters: {bus: 1, feedback: 128}
          comment: 'Feedback delay network: 8 delay lines mixed back into each other'
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 90, hfdecay: 48, lfdecay: 72, moddepth: 24, modrate: 56, notetracking: 0, seed: 7, size: 1600, spread: 77}
          bind: {decay: 2, hfdecay: 3, lfdecay: 4, moddepth: 6, size: {p: 1, min: 400, max: 2800}}
          comment: decay is the reverb time (0 holds the sound); highs and lows are the times of the highs and lows relative to it; mod moves the lines against ringing
        - type: mcsum
          parameters: {bus: 1, gain: 64, stereo: 1, width: 96}
          comment: The tail
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 1}
        - type: mcloopend
          parameters: {bus: 1}
        - type: addp
          parameters: {stereo: 1}
          comment: Early reflections plus the tail
    - id: 2
      name: Ducking reverb
      comment: 'The Reverb module with its wet signal ducked by the dry input: the reverb stays out of the way while notes play and blooms after them. Stereo in, wet only. Uses mc units: Go synth and wasm player only.'
      inputs: 2
      params:
        - {name: size, default: 64}
        - {name: decay, default: 90}
        - {name: highs, default: 48}
        - {name: lows, default: 72}
        - {name: lowcut, default: 56}
        - {name: duck, default: 96}
        - {name: release, default: 62}
        - {name: threshold, default: 8}
      units:
        - type: compressor
          id: 1
          parameters: {attack: 40, invgain: 128, ratio: 96, release: 62, stereo: 1, threshold: 8}
          bind: {ratio: 6, release: 7, threshold: 8}
          comment: 'The gain from the level of the input: duck is how far the reverb is turned down while the input is above threshold, release how soon it comes back'
        - type: xch
          id: 2
          parameters: {stereo: 1}
          comment: The gain below the input
        - type: module
          id: 3
          parameters: {module: 1, p1: 64, p2: 90, p3: 48, p4: 72, p8: 56}
          bind: {p1: 1, p2: 2, p3: 3, p4: 4, p8: 5}
          comment: 'The Reverb module; predelay, mod and highcut stay at their defaults'
        - type: mulp
          id: 4
          parameters: {stereo: 1}
          comment: The reverb times the gain
