name: Horror choir moan
comment: 'A low wordless choir moaning oo and ah: the dead singing. Suggested notes: C-2 to C-4, chords. Knobs: vowel is how far it moves between oo and ah, breath the air, vibrato its depth. Go synth and wasm player only. Velocity turns the level down (-6 dB at 64).'
numvoices: 6
units:
    - type: module
      id: 1
      parameters: {module: 1, p1: 64, p2: 16, p3: 56, p4: 90, p5: 94}
      comment: 'The Horror choir module; its knobs: vowel, breath, vibrato, attack, release'
    - type: velocity
      id: 2
      parameters: {stereo: 1}
      comment: 'Velocity: the level follows it, -6 dB at 64, -12 dB at 32; delete this and the mulp for a level that ignores velocity'
    - type: mulp
      id: 3
      parameters: {stereo: 1}
    - type: outaux
      id: 4
      parameters: {auxgain: 15, outgain: 24, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror choir
      comment: 'A wordless choir: saws through two formants whose vowel moves slowly between oo and ah, vibrato, breath. Stereo out. Bandlimited oscillators and width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: vowel, default: 64}
        - {name: breath, default: 16}
        - {name: vibrato, default: 64}
        - {name: attack, default: 90}
        - {name: release, default: 94}
      units:
        - type: oscillator
          id: 1
          parameters: {bandlimit: 1, color: 128, detune: 69, gain: 40, lfo: 0, phase: 0, shape: 64, stereo: 1, transpose: 64, type: 1, unison: 2}
          comment: 'Voices: saws, three a side, apart'
        - type: oscillator
          id: 2
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 83, type: 0, unison: 0}
          comment: Vibrato
        - type: send
          id: 3
          parameters: {amount: 67, port: 1, sendpop: 1, stereo: 0, target: 1, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 70}}
        - type: noise
          id: 4
          parameters: {gain: 5, shape: 64, stereo: 1}
          bind: {gain: {p: 2, min: 0, max: 40}}
          comment: 'breath: air in the voices'
        - type: addp
          id: 5
          parameters: {stereo: 1}
        - type: push
          id: 6
          parameters: {stereo: 1}
        - type: filter
          id: 7
          parameters: {bandpass: 1, frequency: 19, highpass: 0, lowpass: 0, resonance: 36, stereo: 1}
          comment: 'The first formant: 300 Hz (oo) to 730 Hz (ah)'
        - type: xch
          id: 8
          parameters: {stereo: 1}
        - type: filter
          id: 9
          parameters: {bandpass: 1, frequency: 36, highpass: 0, lowpass: 0, resonance: 48, stereo: 1}
          comment: 'The second: 870 Hz (oo) to 1.1 kHz (ah)'
        - type: addp
          id: 10
          parameters: {stereo: 1}
        - type: oscillator
          id: 11
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 44, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 13, type: 0, unison: 0}
          comment: 'The vowel moves slowly between oo and ah: an LFO...'
        - type: oscillator
          id: 12
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 36, lfo: 1, phase: 40, shape: 64, stereo: 0, transpose: 22, type: 0, unison: 0}
          comment: ...another 1.6 times as fast...
        - type: addp
          id: 13
          parameters: {stereo: 0}
        - type: noise
          id: 14
          parameters: {gain: 128, shape: 64, stereo: 0}
          comment: '...plus a random wander, so that the movement never repeats'
        - type: filter
          id: 15
          parameters: {bandpass: 0, frequency: 3, highpass: 0, lowpass: 1, resonance: 128, stereo: 0}
          comment: ...low-passed at 3.9 Hz...
        - type: dbgain
          id: 16
          parameters: {decibels: 113, stereo: 0}
          comment: ...and raised to a useful level
        - type: addp
          id: 17
          parameters: {stereo: 0}
        - type: send
          id: 18
          parameters: {amount: 74, port: 0, sendpop: 0, stereo: 0, target: 7, voice: 0}
          comment: 'vowel: how far'
        - type: send
          id: 19
          parameters: {amount: 68, port: 0, sendpop: 1, stereo: 0, target: 9, voice: 0}
          bind: {amount: {p: 1, min: 64, max: 72}}
        - type: filter
          id: 20
          parameters: {bandpass: 0, frequency: 12, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
          comment: Low cut
        - type: envelope
          id: 21
          parameters: {attack: 90, curve: 0, decay: 80, gain: 128, release: 94, stereo: 1, sustain: 128}
          bind: {attack: 4, release: 5}
          comment: 'swell is the fade in, release the fade out after the note'
        - type: mulp
          id: 22
          parameters: {stereo: 1}
        - type: width
          id: 23
          parameters: {lowcut: 19, width: 44}
