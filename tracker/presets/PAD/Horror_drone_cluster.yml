name: Horror drone cluster
comment: 'A cluster of four tones a semitone apart, each swelling at its own slow rate so that the cluster shimmers and never repeats; soft triangles. Suggested notes: C-2 to C-4. dissonance is how loud the three upper tones are (0: a single tone), intensity turns the triangles towards saws. Bandlimited oscillators and width: Go synth and wasm player only. Velocity turns the level down (-6 dB at 64) and intensity down.'
numvoices: 2
units:
    - type: velocity
      id: 1
      parameters: {stereo: 0}
      comment: 'Velocity: below 127 it turns intensity down, by up to 48 steps at the softest...'
    - type: loadval
      id: 2
      parameters: {stereo: 0, value: 0}
    - type: addp
      id: 3
      parameters: {stereo: 0}
      comment: '(velocity - 1: 0 at full velocity, so that 127 plays the knob as set)'
    - type: send
      id: 4
      parameters: {amount: 88, port: 0, sendpop: 1, stereo: 0, target: 5, voice: 0}
      comment: '...here: amount 64 makes intensity ignore velocity'
    - type: module
      id: 5
      parameters: {module: 1, p1: 40, p2: 64, p3: 64, p4: 92, p5: 96}
      comment: 'The Horror cluster drone module; its knobs: intensity, dissonance, movement, swell, release'
    - type: velocity
      id: 6
      parameters: {stereo: 1}
      comment: 'Velocity: the level follows it, -6 dB at 64, -12 dB at 32; delete this and the mulp for a level that ignores velocity'
    - type: mulp
      id: 7
      parameters: {stereo: 1}
    - type: outaux
      id: 8
      parameters: {auxgain: 30, outgain: 59, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror cluster drone
      comment: 'A chromatic cluster of triangles, each swelling at its own slow rate, the Ligeti kind of drone. Stereo out. width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: intensity, default: 40}
        - {name: dissonance, default: 64}
        - {name: movement, default: 64}
        - {name: swell, default: 92}
        - {name: release, default: 96}
      units:
        - type: oscillator
          id: 1
          parameters: {bandlimit: 1, color: 75, detune: 61, gain: 60, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 1, unison: 0}
          bind: {color: {p: 1, min: 64, max: 100}}
          comment: 'The note: a triangle'
        - type: oscillator
          id: 2
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 9, type: 0, unison: 0}
          comment: 'Its own swell, 0.071 Hz'
        - type: send
          id: 3
          parameters: {amount: 74, port: 5, sendpop: 1, stereo: 0, target: 1, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 84}}
          comment: 'movement: how much each tone of the cluster swells by itself'
        - type: pan
          id: 4
          parameters: {panning: 64, stereo: 0}
          comment: Each tone in its own place
        - type: oscillator
          id: 5
          parameters: {bandlimit: 1, color: 75, detune: 64, gain: 26, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 65, type: 1, unison: 0}
          bind: {color: {p: 1, min: 64, max: 100}, gain: {p: 2, min: 0, max: 52}}
          comment: 'dissonance: a triangle 1 semitone above, the cluster'
        - type: oscillator
          id: 6
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 32, shape: 64, stereo: 0, transpose: 4, type: 0, unison: 0}
          comment: 'Its own swell, 0.053 Hz'
        - type: send
          id: 7
          parameters: {amount: 74, port: 5, sendpop: 1, stereo: 0, target: 5, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 84}}
          comment: 'movement: how much each tone of the cluster swells by itself'
        - type: pan
          id: 8
          parameters: {panning: 28, stereo: 0}
          comment: Each tone in its own place
        - type: addp
          id: 9
          parameters: {stereo: 1}
        - type: oscillator
          id: 10
          parameters: {bandlimit: 1, color: 75, detune: 67, gain: 26, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 66, type: 1, unison: 0}
          bind: {color: {p: 1, min: 64, max: 100}, gain: {p: 2, min: 0, max: 52}}
          comment: 'dissonance: a triangle 2 semitones above, the cluster'
        - type: oscillator
          id: 11
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 64, shape: 64, stereo: 0, transpose: 13, type: 0, unison: 0}
          comment: 'Its own swell, 0.089 Hz'
        - type: send
          id: 12
          parameters: {amount: 74, port: 5, sendpop: 1, stereo: 0, target: 10, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 84}}
          comment: 'movement: how much each tone of the cluster swells by itself'
        - type: pan
          id: 13
          parameters: {panning: 100, stereo: 0}
          comment: Each tone in its own place
        - type: addp
          id: 14
          parameters: {stereo: 1}
        - type: oscillator
          id: 15
          parameters: {bandlimit: 1, color: 75, detune: 63, gain: 26, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 67, type: 1, unison: 0}
          bind: {color: {p: 1, min: 64, max: 100}, gain: {p: 2, min: 0, max: 52}}
          comment: 'dissonance: a triangle 3 semitones above, the cluster'
        - type: oscillator
          id: 16
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 96, shape: 64, stereo: 0, transpose: 0, type: 0, unison: 0}
          comment: 'Its own swell, 0.041 Hz'
        - type: send
          id: 17
          parameters: {amount: 74, port: 5, sendpop: 1, stereo: 0, target: 15, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 84}}
          comment: 'movement: how much each tone of the cluster swells by itself'
        - type: pan
          id: 18
          parameters: {panning: 44, stereo: 0}
          comment: Each tone in its own place
        - type: addp
          id: 19
          parameters: {stereo: 1}
        - type: oscillator
          id: 20
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 8, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 35, type: 0, unison: 0}
          comment: 'A chorus: the tones again 25 and 32 ms later on each side, moved 0.7 ms either way by this LFO at 0.31 Hz'
        - type: send
          id: 21
          parameters: {amount: 65, port: 4, sendpop: 1, stereo: 0, target: 22, voice: 0}
        - type: delay
          id: 22
          parameters: {damp: 0, dry: 128, feedback: 0, notetracking: 0, pregain: 90, stereo: 1}
          varargs: [1103, 1411]
        - type: filter
          id: 23
          parameters: {bandpass: 0, frequency: 8, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
          comment: Low cut at 27 Hz
        - type: envelope
          id: 24
          parameters: {attack: 92, curve: 0, decay: 80, gain: 128, release: 96, stereo: 1, sustain: 128}
          bind: {attack: 4, release: 5}
          comment: 'swell is the fade in, release the fade out after the note'
        - type: mulp
          id: 25
          parameters: {stereo: 1}
        - type: width
          id: 26
          parameters: {lowcut: 19, width: 64}
