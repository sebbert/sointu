name: Horror glass harmonica
comment: 'A glass harmonica: a pure, piercing, unsettling tone fading in, Victorian séance. Suggested notes: C-4 to C-6. Knobs: brightness, dissonance adds a beating semitone, movement the tremolo, friction the rub. Go synth and wasm player only.'
numvoices: 6
units:
    - type: module
      id: 1
      parameters: {module: 1, p1: 40, p2: 0, p3: 64, p4: 16, p5: 84, p6: 92}
      comment: 'The Horror glass module; its knobs: brightness, dissonance, movement, friction, attack, release'
    - type: outaux
      id: 2
      parameters: {auxgain: 44, outgain: 50, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror glass
      comment: 'A glass harmonica or a rubbed wine glass: a sine with a little third harmonic, slow tremolo, the rub of a finger. Stereo out. width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: brightness, default: 40}
        - {name: dissonance, default: 0}
        - {name: movement, default: 64}
        - {name: friction, default: 24}
        - {name: attack, default: 84}
        - {name: release, default: 92}
      units:
        - type: oscillator
          id: 1
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 80, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 0, unison: 0}
          comment: 'Glass: a sine'
        - type: oscillator
          id: 2
          parameters: {bandlimit: 0, color: 64, detune: 63, gain: 9, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 83, type: 0, unison: 0}
          bind: {gain: {p: 1, min: 0, max: 30}}
          comment: 'brightness: and its third harmonic'
        - type: addp
          id: 3
          parameters: {stereo: 0}
        - type: pan
          id: 4
          parameters: {panning: 56, stereo: 0}
        - type: oscillator
          id: 5
          parameters: {bandlimit: 0, color: 64, detune: 60, gain: 0, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 65, type: 0, unison: 0}
          bind: {gain: {p: 2, min: 0, max: 40}}
          comment: 'dissonance: a sine a semitone above, beating'
        - type: pan
          id: 6
          parameters: {panning: 80, stereo: 0}
        - type: addp
          id: 7
          parameters: {stereo: 1}
        - type: oscillator
          id: 8
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 75, type: 0, unison: 0}
          comment: 'A slow tremolo, as the glass turns'
        - type: send
          id: 9
          parameters: {amount: 70, port: 5, sendpop: 1, stereo: 0, target: 1, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 76}}
          comment: 'movement: its depth'
        - type: noise
          id: 10
          parameters: {gain: 5, shape: 64, stereo: 1}
          bind: {gain: {p: 4, min: 0, max: 24}}
          comment: 'friction: the rub of a wet finger'
        - type: filter
          id: 11
          parameters: {bandpass: 1, frequency: 88, highpass: 0, lowpass: 0, resonance: 40, stereo: 1}
        - type: addp
          id: 12
          parameters: {stereo: 1}
        - type: envelope
          id: 13
          parameters: {attack: 84, curve: 0, decay: 80, gain: 128, release: 92, stereo: 1, sustain: 128}
          bind: {attack: 5, release: 6}
          comment: 'swell is the fade in, release the fade out after the note'
        - type: mulp
          id: 14
          parameters: {stereo: 1}
        - type: width
          id: 15
          parameters: {lowcut: 19, width: 64}
