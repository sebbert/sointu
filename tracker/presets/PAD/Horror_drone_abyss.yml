name: Horror drone abyss
comment: 'A very low resonant growl an octave below the note whose pitch drifts out of tune and back, seasick. Suggested notes: C-2 to C-3 (it sounds an octave lower). movement is how far the pitch drifts. Go synth and wasm player only.'
numvoices: 2
units:
    - type: module
      id: 1
      parameters: {module: 1, p1: 40, p2: 0, p3: 64, p4: 94, p5: 96}
      comment: 'The Horror abyss drone module; its knobs: intensity, dissonance, movement, swell, release'
    - type: outaux
      id: 2
      parameters: {auxgain: 11, outgain: 29, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror abyss drone
      comment: 'A low growl of saws an octave below the note through a resonant low-pass, the pitch drifting. Stereo out. Bandlimited oscillators, ladder, softclip and width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: intensity, default: 40}
        - {name: dissonance, default: 0}
        - {name: movement, default: 64}
        - {name: swell, default: 94}
        - {name: release, default: 96}
      units:
        - type: oscillator
          id: 1
          parameters: {bandlimit: 1, color: 128, detune: 68, gain: 48, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 52, type: 1, unison: 2}
          comment: Three saws an octave below the note
        - type: oscillator
          id: 2
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 3, type: 0, unison: 0}
          comment: 'movement: the pitch drifts up to 30 cents either way, seasick'
        - type: send
          id: 3
          parameters: {amount: 68, port: 1, sendpop: 1, stereo: 0, target: 1, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 72}}
        - type: oscillator
          id: 4
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 80, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 52, type: 0, unison: 0}
          comment: A sine an octave below
        - type: oscillator
          id: 5
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 3, type: 0, unison: 0}
          comment: drifting with the saws
        - type: send
          id: 6
          parameters: {amount: 68, port: 1, sendpop: 1, stereo: 0, target: 4, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 72}}
        - type: addp
          id: 7
          parameters: {stereo: 0}
        - type: oscillator
          id: 8
          parameters: {bandlimit: 1, color: 128, detune: 64, gain: 0, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 53, type: 1, unison: 0}
          bind: {gain: {p: 2, min: 0, max: 40}}
          comment: 'dissonance: a saw a semitone above it'
        - type: addp
          id: 9
          parameters: {stereo: 0}
        - type: pan
          id: 10
          parameters: {panning: 64, stereo: 0}
        - type: ladder
          id: 11
          parameters: {drive: 32, frequency: 15, resonance: 80, stereo: 1}
          bind: {frequency: {p: 1, min: 8, max: 30}}
          comment: 'intensity: a growl from 55 Hz to 800 Hz, resonant'
        - type: oscillator
          id: 12
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: -6, type: 1, unison: 0}
          comment: 'movement: the growl rises and falls once in 34 s'
        - type: send
          id: 13
          parameters: {amount: 68, port: 0, sendpop: 1, stereo: 0, target: 11, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 72}}
        - type: softclip
          id: 14
          parameters: {drive: 15, knee: 64, oversample: 0, stereo: 1}
          bind: {drive: {p: 1, min: 0, max: 48}}
        - type: delay
          id: 15
          parameters: {damp: 0, dry: 128, feedback: 0, notetracking: 0, pregain: 100, stereo: 1}
          varargs: [700, 1500]
          comment: Wide above the lowcut of width
        - type: envelope
          id: 16
          parameters: {attack: 94, curve: 0, decay: 80, gain: 128, release: 96, stereo: 1, sustain: 128}
          bind: {attack: 4, release: 5}
          comment: 'swell is the fade in, release the fade out after the note'
        - type: mulp
          id: 17
          parameters: {stereo: 1}
        - type: width
          id: 18
          parameters: {lowcut: 22, width: 64}
