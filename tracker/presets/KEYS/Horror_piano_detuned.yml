name: Horror piano detuned
comment: 'An old piano out of tune: the two strings of each note a quarter tone apart, beating. Suggested notes: C-2 to C-6. Knobs: tone is the hammer, sustain how long the strings ring. Curved envelopes and width: Go synth and wasm player only. Velocity turns the level down (-6 dB at 64) and tone down.'
numvoices: 8
units:
    - type: velocity
      id: 1
      parameters: {stereo: 0}
      comment: 'Velocity: below 127 it turns tone down, by up to 48 steps at the softest...'
    - type: loadval
      id: 2
      parameters: {stereo: 0, value: 0}
    - type: addp
      id: 3
      parameters: {stereo: 0}
      comment: '(velocity - 1: 0 at full velocity, so that 127 plays the knob as set)'
    - type: send
      id: 4
      parameters: {amount: 88, port: 0, sendpop: 1, stereo: 0, target: 5, voice: 0}
      comment: '...here: amount 64 makes tone ignore velocity'
    - type: module
      id: 5
      parameters: {module: 1, p1: 64, p2: 124}
      comment: 'The Horror piano detuned module; its knobs: tone, sustain'
    - type: velocity
      id: 6
      parameters: {stereo: 1}
      comment: 'Velocity: the level follows it, -6 dB at 64, -12 dB at 32; delete this and the mulp for a level that ignores velocity'
    - type: mulp
      id: 7
      parameters: {stereo: 1}
    - type: outaux
      id: 8
      parameters: {auxgain: 86, outgain: 114, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror piano detuned
      comment: 'An old piano out of tune: the two strings of each note a quarter tone apart, beating. Suggested notes: C-2 to C-6. Stereo out. Curved envelopes and width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: tone, default: 64}
        - {name: sustain, default: 124}
      units:
        - type: envelope
          id: 1
          parameters: {attack: 0, curve: 80, decay: 40, gain: 128, release: 40, stereo: 0, sustain: 0}
          comment: 'The hammer: a short burst'
        - type: push
          id: 2
          parameters: {stereo: 0}
        - type: oscillator
          id: 3
          parameters: {bandlimit: 1, color: 128, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 1, unison: 0}
          comment: of a saw at the note
        - type: noise
          id: 4
          parameters: {gain: 96, shape: 64, stereo: 0}
          comment: and noise
        - type: addp
          id: 5
          parameters: {stereo: 0}
        - type: mulp
          id: 6
          parameters: {stereo: 0}
        - type: filter
          id: 7
          parameters: {bandpass: 0, frequency: 65, highpass: 0, lowpass: 1, resonance: 128, stereo: 0}
          bind: {frequency: {p: 1, min: 30, max: 100}}
          comment: 'tone: how hard the hammer strikes'
        - type: xch
          id: 8
          parameters: {stereo: 0}
        - type: pop
          id: 9
          parameters: {stereo: 0}
        - type: pan
          id: 10
          parameters: {panning: 64, stereo: 0}
        - type: delay
          id: 11
          parameters: {damp: 24, dry: 0, feedback: 127, notetracking: 1, pregain: 128, stereo: 1}
          varargs: [10788, 10636]
          bind: {feedback: {p: 2, min: 116, max: 127}}
          comment: 'The strings: a comb on the note per side, the right one a little sharp; sustain is how long they ring'
        - type: filter
          id: 12
          parameters: {bandpass: 0, frequency: 10, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
          comment: Low cut
        - type: envelope
          id: 13
          parameters: {attack: 0, curve: 40, decay: 64, gain: 128, release: 72, stereo: 1, sustain: 128}
          comment: 'The damper: the note stops when released'
        - type: mulp
          id: 14
          parameters: {stereo: 1}
        - type: width
          id: 15
          parameters: {lowcut: 19, width: 60}
