name: Club 909 hat open
comment: 'An open hi-hat: like Club 909 hat closed with a long decay. Releasing the note chokes it. Suggested note: C-5; the note tunes the metal. To route it to the drum bus of Global mastering 2 drumbus, change the last unit from out to aux, channel 6. Curved envelopes: Go synth and wasm player only.'
numvoices: 1
units:
    - type: oscillator
      id: 1
      parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 107, type: 2, unison: 0}
      comment: Modulator
    - type: send
      id: 2
      parameters: {amount: 70, port: 6, sendpop: 1, stereo: 0, target: 3, voice: 0}
      comment: 'How metallic: the amount of frequency modulation'
    - type: oscillator
      id: 3
      parameters: {bandlimit: 0, color: 64, detune: 64, gain: 64, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 95, type: 2, unison: 0}
      comment: 'The metal: a square wave, frequency modulated into a dense, inharmonic spectrum'
    - type: noise
      id: 4
      parameters: {gain: 40, shape: 64, stereo: 0}
      comment: The level of the noise against the metal
    - type: addp
      id: 5
      parameters: {stereo: 0}
    - type: envelope
      id: 6
      parameters: {attack: 0, curve: 80, decay: 78, gain: 128, release: 54, stereo: 0, sustain: 0}
      comment: decay is the length; release is how fast it is choked when the note is released
    - type: mulp
      id: 7
      parameters: {stereo: 0}
    - type: filter
      id: 8
      parameters: {bandpass: 0, frequency: 100, highpass: 1, lowpass: 0, resonance: 128, stereo: 0}
      comment: Low cut
    - type: filter
      id: 9
      parameters: {bandpass: 1, frequency: 120, highpass: 0, lowpass: 0, resonance: 64, stereo: 0}
      comment: 'The band that is left: frequency is its centre'
    - type: pan
      id: 10
      parameters: {panning: 64, stereo: 0}
    - type: out
      id: 11
      parameters: {gain: 15, stereo: 1}
      comment: 'The level. For the drum bus, make this an aux unit with channel 6'
