name: Kick ducker
comment: 'A kick for dnb, techno and trance that ducks a bus: send what should pump to aux 4/5 (aux, channel 4) instead of out, and put this instrument after those. G below note 60 is 49 Hz. Envelope curves: Go synth and wasm player only.'
numvoices: 1
units:
    - id: 1
      parameters: {}
      comment: Pitch drop
    - type: envelope
      id: 2
      parameters: {attack: 0, curve: 96, decay: 64, gain: 128, release: 64, stereo: 0, sustain: 0}
      comment: 'decay is the time of the drop, 93 ms, curve how much of it happens at once'
    - type: send
      id: 3
      parameters: {amount: 90, port: 0, sendpop: 1, target: 5}
      comment: 'amount is where the drop starts: 52 semitones up'
    - id: 4
      parameters: {}
      comment: Body
    - type: oscillator
      id: 5
      parameters: {color: 128, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 52, type: 0, unison: 0}
      comment: A sine, an octave below the note
    - type: envelope
      id: 6
      parameters: {attack: 0, curve: 64, decay: 72, gain: 128, release: 72, stereo: 0, sustain: 0}
      comment: 'decay is the length, 263 ms: 70 for fast dnb, 74 for techno'
    - type: mulp
      id: 7
      parameters: {stereo: 0}
    - type: distort
      id: 8
      parameters: {drive: 116, stereo: 0}
      comment: 'Harmonics and a flat, loud body: less drive is rounder and quieter'
    - id: 9
      parameters: {}
      comment: Click
    - type: envelope
      id: 10
      parameters: {attack: 0, decay: 36, gain: 48, release: 36, stereo: 0, sustain: 0}
      comment: '2.4 ms of noise; gain is its level'
    - type: noise
      id: 11
      parameters: {gain: 128, shape: 64, stereo: 0}
    - type: mulp
      id: 12
      parameters: {stereo: 0}
    - type: filter
      id: 13
      parameters: {bandpass: 0, frequency: 100, highpass: 1, lowpass: 0, resonance: 128, stereo: 0}
      comment: Only its highs, above 4.4 kHz
    - type: addp
      id: 14
      parameters: {stereo: 0}
    - id: 15
      parameters: {}
      comment: Output
    - type: pan
      id: 16
      parameters: {panning: 64, stereo: 0}
    - type: out
      id: 17
      parameters: {gain: 100, stereo: 1}
      comment: The level of the kick
    - id: 18
      parameters: {}
      comment: The ducked bus
    - type: in
      id: 19
      parameters: {channel: 4, stereo: 1}
      comment: 'What the other instruments send to aux 4/5. The reverb presets read aux 2/3'
    - type: module
      id: 20
      parameters: {module: 1}
      comment: 'The Ducker module: depth, release (the time back to full level) and curve. It follows the note of the kick'
    - type: out
      id: 21
      parameters: {gain: 128, stereo: 1}
      comment: 'The level of the bus. An outaux here sends it to the reverb too'
modules:
    - id: 1
      name: Ducker
      comment: 'Sidechain ducking without a compressor: the stereo signal times 1 - depth·envelope, the envelope triggered by the note of the instrument it is in. Put it in the kick instrument, between an in from the bus of what should duck and an out. Go synth and wasm player only if curve is not 0.'
      inputs: 2
      params:
        - {name: depth, default: 128, display: ott.depth}
        - {name: release, default: 70}
        - {name: curve, default: 0}
      units:
        - type: envelope
          id: 1
          parameters: {attack: 30, curve: 0, decay: 70, gain: 128, release: 70, stereo: 0, sustain: 0}
          bind: {curve: 3, decay: 2, gain: 1, release: 2}
          comment: 'How far the gain is turned down: depth is its gain, release the time back to full level, curve bends the way back (fast first). attack is the time down, 1 ms: 0 steps in one sample and clicks'
        - type: send
          id: 2
          parameters: {amount: 0, port: 0, sendpop: 1, target: 3}
          comment: Minus the envelope to the gain below
        - type: gain
          id: 3
          parameters: {gain: 128, stereo: 1}
          comment: 'The ducked signal: 1 minus the envelope'
