name: Global mastering reverb
numvoices: 1
units:
    - id: 1
      parameters: {}
      comment: 'Global mastering with reverb - Global mastering, and before it the aux signal through the reverb unit. Set this preset as last instrument. The reverb unit: Go synth and wasm player only.'
    - type: in
      id: 2
      parameters: {channel: 2, stereo: 1}
      comment: The aux signal the instruments send, with outaux or aux
    - type: reverb
      id: 3
      parameters: {allpass: 0, bypass: 0, decay: 90, diffuser: 0, early: 52, earlywidth: 80, gain: 76, highcut: 98, highs: 48, loopgain: 0, loopmod: 0, looprate: 64, loopsize: 0, lowcut: 56, lows: 72, mod: 24, modrate: 56, network: 0, predelay: 13, pretime: 0, size: 64, spread: 77, steps: 4, tailwidth: 96}
      comment: 'The reverb: size, decay, highs, lows, predelay, mod, highcut and lowcut are those of the Reverb module, which this unit renders; the parameters after them are what the module fixes'
    - type: out
      id: 4
      parameters: {gain: 128, stereo: 1}
      comment: The level of the reverb, into the mix that is mastered below
    - type: in
      id: 1170
      parameters: {channel: 0, stereo: 1}
    - type: filter
      id: 1171
      parameters: {bandpass: -1, frequency: 128, highpass: 0, lowpass: 1, resonance: 128, stereo: 1}
      comment: Limit highs
    - type: filter
      id: 1166
      parameters: {bandpass: 1, frequency: 10, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
      comment: Low cut
    - type: compressor
      id: 1167
      parameters: {attack: 42, invgain: 89, ratio: 92, release: 42, stereo: 1, threshold: 83}
    - type: mulp
      id: 1168
      parameters: {stereo: 1}
    - type: out
      id: 1172
      parameters: {gain: 116, stereo: 1}
      comment: Master gain
