name: Reverb unit Plate
numvoices: 1
units:
    - id: 1
      parameters: {}
      comment: 'The preset Reverb FDN Plate as one reverb unit, for comparing: it renders the same. Go synth and wasm player only. Load this before Global mastering.'
    - type: in
      id: 2
      parameters: {channel: 2, stereo: 1}
      comment: Set channel to 4 for a second reverb; send to it with aux
    - type: reverb
      id: 3
      parameters: {allpass: 96, bypass: 5, decay: 98, diffuser: 90, early: 40, earlywidth: 64, gain: 85, highcut: 91, highs: 80, loopgain: 64, loopmod: 12, looprate: 70, loopsize: 300, lowcut: 56, lows: 56, mod: 10, modrate: 64, network: 1100, predelay: 13, pretime: 0, size: 64, spread: 64, steps: 2, tailwidth: 64}
      comment: 'allpass makes the diffuser of allpasses; loopsize, loopgain, loopmod and looprate are the allpass lines in the network'
    - type: out
      id: 4
      parameters: {gain: 128, stereo: 1}
