name: Global mastering 2 ducking
numvoices: 1
units:
    - id: 1
      parameters: {}
      comment: 'Global mastering 2 with a ducking delay and a ducking reverb - set this preset as last instrument. Aux 6/7 (aux, channel 6) goes through the Ducking delay module, aux 2/3 (outaux or aux) through the Ducking reverb module, then Global mastering 2. Aux 4/5 is left to the bus that Kick ducker ducks. mc units and a limiter: Go synth and wasm player only.'
    - type: in
      id: 2
      parameters: {channel: 6, stereo: 1}
      comment: The signal the instruments send to aux 6/7
    - type: module
      id: 3
      parameters: {module: 2}
      comment: 'The Ducking delay module: its parameters are time, feedback, tone, lowcut and pan of the delay, then duck, release and threshold of the ducking'
    - type: outaux
      id: 4
      parameters: {auxgain: 32, outgain: 128, stereo: 1}
      comment: 'outgain is the level of the repeats, auxgain how much of them goes to the reverb'
    - type: in
      id: 5
      parameters: {channel: 2, stereo: 1}
      comment: The aux signal the instruments send, with outaux or aux
    - type: module
      id: 6
      parameters: {module: 4}
      comment: 'The Ducking reverb module: its parameters are size, decay, highs, lows and lowcut of the reverb, then duck, release and threshold of the ducking'
    - type: out
      id: 7
      parameters: {gain: 128, stereo: 1}
      comment: The level of the reverb, into the mix that is mastered below
    - type: in
      id: 10
      parameters: {channel: 0, stereo: 1}
    - type: filter
      id: 11
      parameters: {bandpass: 0, frequency: 8, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
      comment: Low cut, 12 dB per octave below 27 Hz
    - type: compressor
      id: 12
      parameters: {attack: 47, invgain: 54, ratio: 100, release: 68, stereo: 1, threshold: 64}
      comment: 'About 4.6:1 above -6 dB, 10 ms attack and 150 ms release, +7.5 dB makeup (invgain). A shorter release distorts the bass more'
    - type: mulp
      id: 13
      parameters: {stereo: 1}
    - type: limiter
      id: 16
      parameters: {drive: 12, lookahead: 32, release: 64, stereo: 1, threshold: 124}
      comment: 'Turns the gain down ahead of the peaks that the attack lets through, 2.9 ms ahead, to -0.3 dB. drive, +4.4 dB, is the loudness: more of it is louder and flatter'
    - type: clip
      id: 14
      parameters: {stereo: 1}
      comment: What little the limiter lets through is clipped at full scale
    - type: out
      id: 15
      parameters: {gain: 128, stereo: 1}
      comment: Master gain
modules:
    - id: 1
      name: Ping pong delay
      comment: 'Tempo-synced ping-pong delay, wet only: the sum of the stereo input goes into one side, and each repeat goes through a low-pass and a low cut into the other side.'
      inputs: 2
      params:
        - {name: time, default: 36}
        - {name: feedback, default: 80}
        - {name: tone, default: 80}
        - {name: lowcut, default: 32}
        - {name: pan, default: 0}
      units:
        - type: addp
          id: 1
          parameters: {stereo: 0}
          comment: Left plus right
        - type: pan
          id: 2
          parameters: {panning: 0, stereo: 0}
          bind: {panning: 5}
          comment: 'The side of the first repeat: 0 left, 128 right, 64 both, which is a mono delay'
        - type: receive
          id: 3
          parameters: {stereo: 1}
          comment: The repeats coming back, a sample late
        - type: addp
          id: 4
          parameters: {stereo: 1}
        - type: delay
          id: 5
          parameters: {damp: 0, dry: 0, feedback: 0, notetracking: 2, pregain: 128, stereo: 1}
          varargs: [36, 36]
          bind: {delaytime1: 1, delaytime2: 1}
          comment: 'One line per side, of the same time: 36 is a dotted eighth, 24 an eighth, 48 a quarter'
        - type: push
          id: 6
          parameters: {stereo: 1}
        - type: filter
          id: 7
          parameters: {bandpass: 0, frequency: 89, highpass: 0, lowpass: 1, resonance: 128, stereo: 1}
          bind: {frequency: {p: 3, min: 24, max: 128}}
          comment: 'tone: each repeat darker'
        - type: filter
          id: 8
          parameters: {bandpass: 0, frequency: 16, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
          bind: {frequency: {p: 4, min: 0, max: 64}}
          comment: 'lowcut: each repeat thinner; 0 is off'
        - type: xch
          id: 9
          parameters: {stereo: 0}
          comment: Left to right and right to left
        - type: send
          id: 10
          parameters: {amount: 92, port: 0, sendpop: 1, stereo: 1, target: 3}
          bind: {amount: {p: 2, min: 64, max: 109}}
          comment: 'feedback: the level of a repeat relative to the one before, up to 70 %. More would ring: where the two filters meet they raise the level by up to 2.7 dB'
    - id: 2
      name: Ducking delay
      comment: 'The Ping pong delay module with its repeats ducked by the dry input: the repeats stay out of the way while notes play and come up in the gaps. Stereo in, wet only.'
      inputs: 2
      params:
        - {name: time, default: 36}
        - {name: feedback, default: 80}
        - {name: tone, default: 80}
        - {name: lowcut, default: 32}
        - {name: pan, default: 0}
        - {name: duck, default: 96}
        - {name: release, default: 62}
        - {name: threshold, default: 8}
      units:
        - type: compressor
          id: 1
          parameters: {attack: 40, invgain: 128, ratio: 96, release: 62, stereo: 1, threshold: 8}
          bind: {ratio: 6, release: 7, threshold: 8}
          comment: 'The gain from the level of the input: duck is how far the repeats are turned down while the input is above threshold, release how soon they come back'
        - type: xch
          id: 2
          parameters: {stereo: 1}
          comment: The gain below the input
        - type: module
          id: 3
          parameters: {module: 1, p1: 36, p2: 80, p3: 80, p4: 32, p5: 0}
          bind: {p1: 1, p2: 2, p3: 3, p4: 4, p5: 5}
          comment: The Ping pong delay module
        - type: mulp
          id: 4
          parameters: {stereo: 1}
          comment: The repeats times the gain
    - id: 3
      name: Reverb
      comment: 'Stereo reverb, wet only: low and high cut, predelay, a diffuser of four steps for the early reflections, and a feedback delay network of 8 lines for the tail. Uses mc units: Go synth and wasm player only.'
      inputs: 2
      params:
        - {name: size, default: 64}
        - {name: decay, default: 90}
        - {name: highs, default: 48}
        - {name: lows, default: 72}
        - {name: predelay, default: 13}
        - {name: mod, default: 24}
        - {name: highcut, default: 98}
        - {name: lowcut, default: 56}
      units:
        - type: mcspread
          parameters: {add: 0, bus: 1, gain: 76, stereo: 1}
          comment: The stereo input on the 8 channels of the bus; gain is the level of the reverb
        - type: mcfilter
          parameters: {bus: 1, frequency: 37, type: 1}
          bind: {frequency: {p: 8, min: 0, max: 85}}
          comment: Low cut
        - type: mcfilter
          parameters: {bus: 1, frequency: 115, type: 0}
          bind: {frequency: {p: 7, min: 72, max: 128}}
          comment: High cut
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 0, size: 204, spread: 0}
          bind: {size: {p: 5, min: 1, max: 2000}}
          comment: 'Predelay: all 8 lines of the same length'
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 1, size: 400, spread: 128}
          bind: {size: {p: 1, min: 100, max: 700}}
          comment: 'Diffuser: each step delays the channels by random amounts up to its size, shuffles and mixes them'
        - type: mcmix
          parameters: {bus: 1, seed: 1, type: 2}
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 0}
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 2, size: 200, spread: 128}
          bind: {size: {p: 1, min: 50, max: 350}}
        - type: mcmix
          parameters: {bus: 1, seed: 2, type: 2}
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 0}
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 3, size: 100, spread: 128}
          bind: {size: {p: 1, min: 25, max: 175}}
        - type: mcmix
          parameters: {bus: 1, seed: 3, type: 2}
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 0}
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 0, hfdecay: 64, lfdecay: 64, moddepth: 0, modrate: 64, notetracking: 0, seed: 4, size: 50, spread: 128}
          bind: {size: {p: 1, min: 12, max: 88}}
        - type: mcmix
          parameters: {bus: 1, seed: 4, type: 2}
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 0}
        - type: mcsum
          parameters: {bus: 1, gain: 52, stereo: 1, width: 80}
          comment: 'Early reflections: the diffused input'
        - type: mcloop
          parameters: {bus: 1, feedback: 128}
          comment: 'Feedback delay network: 8 delay lines mixed back into each other'
        - type: mcdelay
          parameters: {allpass: 0, apgain: 80, bus: 1, decay: 90, hfdecay: 48, lfdecay: 72, moddepth: 24, modrate: 56, notetracking: 0, seed: 7, size: 1600, spread: 77}
          bind: {decay: 2, hfdecay: 3, lfdecay: 4, moddepth: 6, size: {p: 1, min: 400, max: 2800}}
          comment: decay is the reverb time (0 holds the sound); highs and lows are the times of the highs and lows relative to it; mod moves the lines against ringing
        - type: mcsum
          parameters: {bus: 1, gain: 64, stereo: 1, width: 96}
          comment: The tail
        - type: mcmix
          parameters: {bus: 1, seed: 0, type: 1}
        - type: mcloopend
          parameters: {bus: 1}
        - type: addp
          parameters: {stereo: 1}
          comment: Early reflections plus the tail
    - id: 4
      name: Ducking reverb
      comment: 'The Reverb module with its wet signal ducked by the dry input: the reverb stays out of the way while notes play and blooms after them. Stereo in, wet only. Uses mc units: Go synth and wasm player only.'
      inputs: 2
      params:
        - {name: size, default: 64}
        - {name: decay, default: 90}
        - {name: highs, default: 48}
        - {name: lows, default: 72}
        - {name: lowcut, default: 56}
        - {name: duck, default: 96}
        - {name: release, default: 62}
        - {name: threshold, default: 8}
      units:
        - type: compressor
          id: 1
          parameters: {attack: 40, invgain: 128, ratio: 96, release: 62, stereo: 1, threshold: 8}
          bind: {ratio: 6, release: 7, threshold: 8}
          comment: 'The gain from the level of the input: duck is how far the reverb is turned down while the input is above threshold, release how soon it comes back'
        - type: xch
          id: 2
          parameters: {stereo: 1}
          comment: The gain below the input
        - type: module
          id: 3
          parameters: {module: 3, p1: 64, p2: 90, p3: 48, p4: 72, p8: 56}
          bind: {p1: 1, p2: 2, p3: 3, p4: 4, p8: 5}
          comment: 'The Reverb module; predelay, mod and highcut stay at their defaults'
        - type: mulp
          id: 4
          parameters: {stereo: 1}
          comment: The reverb times the gain
