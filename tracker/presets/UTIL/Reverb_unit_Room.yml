name: Reverb unit Room
numvoices: 1
units:
    - id: 1
      parameters: {}
      comment: 'The preset Reverb FDN Room as one reverb unit, for comparing: it renders the same. Go synth and wasm player only. Load this before Global mastering.'
    - type: in
      id: 2
      parameters: {channel: 2, stereo: 1}
      comment: Set channel to 4 for a second reverb; send to it with aux
    - type: reverb
      id: 3
      parameters: {bypass: 7, decay: 58, diffuser: 200, early: 58, earlywidth: 64, gain: 74, highcut: 98, highs: 48, lowcut: 56, lows: 64, mod: 8, modrate: 64, network: 400, predelay: 13, pretime: 0, size: 64, spread: 64, steps: 3, tailwidth: 64}
      comment: 'bypass leaves the filters and the predelay out; network and diffuser set the lengths instead of size'
    - type: out
      id: 4
      parameters: {gain: 128, stereo: 1}
