name: Club reese bass
comment: 'A reese bass: detuned saws beating against each other through a slowly moving ladder filter, saturated, over a clean sine sub. The saws are cut below about 200 Hz before the saturation, so the sub stays steady. Mono below about 150 Hz. Suggested notes: C-1 to C-2. Bandlimited oscillators, ladder, softclip and width: Go synth and wasm player only.'
numvoices: 1
units:
    - type: oscillator
      id: 1
      parameters: {bandlimit: 1, color: 128, detune: 84, gain: 64, lfo: 0, phase: 0, shape: 64, stereo: 1, transpose: 64, type: 1, unison: 1}
      comment: Two detuned saws on each side; detune is the speed of the beating
    - type: filter
      id: 2
      parameters: {bandpass: 0, frequency: 22, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
      comment: 'Low cut of the saws: the crossover to the sub. Lower is fuller, but lets the beating into the sub'
    - type: oscillator
      id: 3
      parameters: {bandlimit: 0, color: 128, detune: 64, gain: 128, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 36, type: 0, unison: 0}
      comment: 'Filter movement: transpose is its speed'
    - type: send
      id: 4
      parameters: {amount: 70, port: 0, sendpop: 1, stereo: 0, target: 5, voice: 0}
      comment: How far the filter moves
    - type: ladder
      id: 5
      parameters: {drive: 24, frequency: 40, resonance: 48, stereo: 1}
      comment: 'frequency is the brightness, resonance the nasal tone, drive the growl'
    - type: softclip
      id: 6
      parameters: {drive: 32, knee: 48, oversample: 1, stereo: 1}
      comment: 'Saturation, which also keeps the peaks of the saws down; oversampled against aliasing'
    - type: width
      id: 7
      parameters: {lowcut: 19, width: 56}
      comment: 'Width, and mono below lowcut'
    - type: oscillator
      id: 8
      parameters: {bandlimit: 0, color: 128, detune: 64, gain: 100, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 0, unison: 0}
      comment: 'The sub: a sine, the same on both sides; gain is its level against the saws'
    - type: push
      id: 9
      parameters: {stereo: 0}
    - type: addp
      id: 10
      parameters: {stereo: 1}
    - type: envelope
      id: 11
      parameters: {attack: 40, curve: 0, decay: 64, gain: 128, release: 60, stereo: 1, sustain: 128}
    - type: mulp
      id: 12
      parameters: {stereo: 1}
    - type: out
      id: 13
      parameters: {gain: 34, stereo: 1}
