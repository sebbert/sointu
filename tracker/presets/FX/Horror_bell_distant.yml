name: Horror bell distant
comment: 'A church bell tolling far away, its minor-third tierce hanging in the fog; long decay, mostly hall. Suggested notes: C-2 to C-4. Knob: distance, the high cut. Go synth and wasm player only. Velocity turns the level down (-6 dB at 64) and distance down.'
numvoices: 2
units:
    - type: velocity
      id: 1
      parameters: {stereo: 0}
      comment: 'Velocity: below 127 it turns distance down, by up to 48 steps at the softest...'
    - type: loadval
      id: 2
      parameters: {stereo: 0, value: 0}
    - type: addp
      id: 3
      parameters: {stereo: 0}
      comment: '(velocity - 1: 0 at full velocity, so that 127 plays the knob as set)'
    - type: send
      id: 4
      parameters: {amount: 88, port: 0, sendpop: 1, stereo: 0, target: 5, voice: 0}
      comment: '...here: amount 64 makes distance ignore velocity'
    - type: module
      id: 5
      parameters: {module: 1, p1: 36}
      comment: 'The Horror bell module; its knobs: distance'
    - type: velocity
      id: 6
      parameters: {stereo: 1}
      comment: 'Velocity: the level follows it, -6 dB at 64, -12 dB at 32; delete this and the mulp for a level that ignores velocity'
    - type: mulp
      id: 7
      parameters: {stereo: 1}
    - type: outaux
      id: 8
      parameters: {auxgain: 98, outgain: 49, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror bell
      comment: 'A church bell: its partials (hum, prime, minor third, fifth, octave...) each decaying at its own rate, a clapper, a high cut for the distance. Stereo out. Curved envelopes, ladder and width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: distance, default: 48}
