name: Club impact
comment: 'An impact: a sine that drops two octaves to the note, with a burst of low-passed noise, driven, with a long tail. Suggested notes: C-1 to A-1. auxgain sends it to the reverb, which is what gives it its space. Curved envelopes and softclip: Go synth and wasm player only.'
numvoices: 1
units:
    - type: envelope
      id: 1
      parameters: {attack: 0, curve: 96, decay: 72, gain: 128, release: 72, stereo: 0, sustain: 0}
      comment: Pitch drop
    - type: send
      id: 2
      parameters: {amount: 76, port: 0, sendpop: 1, stereo: 0, target: 3, voice: 0}
      comment: How far above the note the drop starts
    - type: oscillator
      id: 3
      parameters: {bandlimit: 0, color: 128, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 0, unison: 0}
    - type: noise
      id: 4
      parameters: {gain: 128, shape: 64, stereo: 0}
      comment: The level of the noise
    - type: filter
      id: 5
      parameters: {bandpass: 0, frequency: 56, highpass: 0, lowpass: 1, resonance: 128, stereo: 0}
      comment: The brightness of the noise
    - type: addp
      id: 6
      parameters: {stereo: 0}
    - type: envelope
      id: 7
      parameters: {attack: 0, curve: 72, decay: 88, gain: 128, release: 84, stereo: 0, sustain: 0}
      comment: decay is the length of the tail
    - type: mulp
      id: 8
      parameters: {stereo: 0}
    - type: softclip
      id: 9
      parameters: {drive: 14, knee: 48, oversample: 0, stereo: 0}
      comment: drive is how hard the boom hits the clipper
    - type: pan
      id: 10
      parameters: {panning: 64, stereo: 0}
    - type: outaux
      id: 11
      parameters: {auxgain: 64, outgain: 128, stereo: 1}
