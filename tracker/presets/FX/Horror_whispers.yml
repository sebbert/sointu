name: Horror whispers
comment: 'Whispering voices without words, one on each side: they are talking about you. Hold the note; the pitch does not matter. Knob: speed of the syllables. Go synth and wasm player only. Velocity turns the level down (-6 dB at 64).'
numvoices: 1
units:
    - type: module
      id: 1
      parameters: {module: 1, p1: 64}
      comment: 'The Horror whispers module; its knobs: speed'
    - type: velocity
      id: 2
      parameters: {stereo: 1}
      comment: 'Velocity: the level follows it, -6 dB at 64, -12 dB at 32; delete this and the mulp for a level that ignores velocity'
    - type: mulp
      id: 3
      parameters: {stereo: 1}
    - type: outaux
      id: 4
      parameters: {auxgain: 22, outgain: 36, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror whispers
      comment: 'Whispering voices without words: noise through two wandering formants, syllables of random level, two whisperers left and right. Stereo out. Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: speed, default: 64}
      units:
        - type: noise
          id: 1
          parameters: {gain: 128, shape: 64, stereo: 0}
          comment: 'A whisper: noise'
        - type: filter
          id: 2
          parameters: {bandpass: 1, frequency: 40, highpass: 0, lowpass: 0, resonance: 40, stereo: 0}
          comment: through two formants that wander like syllables
        - type: filter
          id: 3
          parameters: {bandpass: 1, frequency: 72, highpass: 0, lowpass: 0, resonance: 48, stereo: 0}
        - type: noise
          id: 4
          parameters: {gain: 128, shape: 64, stereo: 0}
          comment: 'The formants wander, syllable by syllable'
        - type: filter
          id: 5
          parameters: {bandpass: 0, frequency: 4, highpass: 0, lowpass: 1, resonance: 128, stereo: 0}
          comment: ...low-passed at 6.9 Hz...
        - type: dbgain
          id: 6
          parameters: {decibels: 111, stereo: 0}
          comment: ...and raised to a useful level
        - type: send
          id: 7
          parameters: {amount: 76, port: 0, sendpop: 1, stereo: 0, target: 2, voice: 0}
        - type: noise
          id: 8
          parameters: {gain: 128, shape: 64, stereo: 0}
          comment: 'A random wander: noise...'
        - type: filter
          id: 9
          parameters: {bandpass: 0, frequency: 5, highpass: 0, lowpass: 1, resonance: 128, stereo: 0}
          comment: ...low-passed at 10.7 Hz...
        - type: dbgain
          id: 10
          parameters: {decibels: 108, stereo: 0}
          comment: ...and raised to a useful level
        - type: send
          id: 11
          parameters: {amount: 80, port: 0, sendpop: 1, stereo: 0, target: 3, voice: 0}
        - type: noise
          id: 12
          parameters: {gain: 128, shape: 64, stereo: 0}
          comment: 'The syllables: the level jumps...'
        - type: filter
          id: 13
          parameters: {bandpass: 0, frequency: 10, highpass: 0, lowpass: 1, resonance: 128, stereo: 0}
          bind: {frequency: {p: 1, min: 6, max: 14}}
          comment: ...low-passed at 34.7 Hz...
        - type: dbgain
          id: 14
          parameters: {decibels: 115, stereo: 0}
          comment: ...and raised to a useful level
        - type: push
