name: Horror hit
comment: 'A short, hard hit with a short room: a slammed door, a body hitting the floor. Suggested notes: C-1 to C-2. Velocity turns the level down (-6 dB at 64). It has its own hall (reverb unit): no send. One voice: each hit cuts the tail of the last; give it two voices for overlapping tails (each a hall: 0.8 MB, 0.3 µs a sample). Curved envelopes, softclip and reverb: Go synth and wasm player only.'
numvoices: 1
units:
    - type: envelope
      id: 1
      parameters: {attack: 0, curve: 96, decay: 62, gain: 128, release: 62, stereo: 0, sustain: 0}
      comment: The pitch drop
    - type: send
      id: 2
      parameters: {amount: 76, port: 0, sendpop: 1, stereo: 0, target: 3, voice: 0}
      comment: The body starts 24 semitones above the note and drops to it
    - type: oscillator
      id: 3
      parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 0, unison: 0}
      comment: 'The body: a sine dropping to the note'
    - type: noise
      id: 4
      parameters: {gain: 128, shape: 64, stereo: 0}
      comment: The burst of noise
    - type: filter
      id: 5
      parameters: {bandpass: 0, frequency: 72, highpass: 0, lowpass: 1, resonance: 110, stereo: 0}
      comment: its brightness
    - type: envelope
      id: 6
      parameters: {attack: 0, curve: 96, decay: 68, gain: 128, release: 60, stereo: 0, sustain: 0}
    - type: mulp
      id: 7
      parameters: {stereo: 0}
    - type: addp
      id: 8
      parameters: {stereo: 0}
    - type: envelope
      id: 9
      parameters: {attack: 0, curve: 72, decay: 76, gain: 128, release: 76, stereo: 0, sustain: 0}
      comment: The length of the hit
    - type: mulp
      id: 10
      parameters: {stereo: 0}
    - type: softclip
      id: 11
      parameters: {drive: 16, knee: 48, oversample: 0, stereo: 0}
      comment: 'drive: how hard it hits'
    - type: pan
      id: 12
      parameters: {panning: 64, stereo: 0}
    - type: push
      id: 13
      parameters: {stereo: 1}
    - type: reverb
      id: 14
      parameters: {allpass: 0, bypass: 0, decay: 92, diffuser: 0, early: 52, earlywidth: 64, gain: 76, highcut: 60, highs: 40, loopgain: 0, loopmod: 0, looprate: 64, loopsize: 0, lowcut: 24, lows: 88, mod: 40, modrate: 56, network: 0, predelay: 24, pretime: 0, size: 60, spread: 77, steps: 4, tailwidth: 72}
      comment: 'Its own space: a large hall, the tail of the hit'
    - type: gain
      id: 15
      parameters: {gain: 40, stereo: 1}
      comment: The level of the tail
    - type: addp
      id: 16
      parameters: {stereo: 1}
    - type: filter
      id: 17
      parameters: {bandpass: 0, frequency: 6, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
      comment: Low cut at 15 Hz
    - type: velocity
      id: 18
      parameters: {stereo: 1}
      comment: 'Velocity: the level follows it, -6 dB at 64'
    - type: mulp
      id: 19
      parameters: {stereo: 1}
    - type: out
      id: 20
      parameters: {gain: 127, stereo: 1}
      comment: The level
