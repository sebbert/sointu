name: Horror shepard riser
comment: 'An endless rise, the Shepard tone of Dunkirk: tension that never resolves. An octave in 6 s. Hold the note as long as the rise should last: it never arrives anywhere. Suggested notes: C-3 to C-5 (the tones span two octaves either side of the note). Knobs: speed (0: an octave in 6 s, 128: an octave a second), direction 128 up, 0 down, 64 up and down, timbre from triangles to saws, brightness the low-pass. Go synth and wasm player only.'
numvoices: 1
units:
    - type: module
      id: 1
      parameters: {module: 1, p1: 0, p2: 128, p3: 72, p4: 48, p5: 84, p6: 90}
      comment: 'The Horror shepard module; its knobs: speed, direction, timbre, brightness, attack, release'
    - type: outaux
      id: 2
      parameters: {auxgain: 22, outgain: 36, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror shepard
      comment: 'A Shepard tone: four tones an octave apart rise together, each fading in at the bottom and out at the top of a four-octave range, so the whole seems to rise forever. Stereo out. Bandlimited oscillators, ladder and width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: speed, default: 64}
        - {name: direction, default: 128}
        - {name: timbre, default: 64}
        - {name: brightness, default: 48}
        - {name: attack, default: 84}
        - {name: release, default: 90}
      units:
        - type: oscillator
          id: 1
          parameters: {bandlimit: 0, color: 128, detune: 64, gain: 128, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 16, type: 1, unison: 0}
          bind: {color: 2, transpose: {p: 1, min: 0, max: 31}}
          comment: 'The rise of tone 1: a saw LFO from -1 to 1, once in 24 s at speed 0 (an octave in 6 s), once in 4 s at speed 128 (an octave a second); direction 128 rises, 0 falls, 64 rises and falls'
        - type: send
          id: 2
          parameters: {amount: 76, port: 0, sendpop: 0, stereo: 0, target: 9, voice: 0}
          comment: 'The pitch of the tone: 24 semitones below the note to 24 above over the cycle'
        - type: push
          id: 3
          parameters: {stereo: 0}
        - type: mulp
          id: 4
          parameters: {stereo: 0}
        - type: loadval
          id: 5
          parameters: {stereo: 0, value: 0}
        - type: addp
          id: 6
          parameters: {stereo: 0}
        - type: push
          id: 7
          parameters: {stereo: 0}
        - type: mulp
          id: 8
          parameters: {stereo: 0}
          comment: 'The level of the tone, (1 - x²)²: silent at both ends of the cycle, loudest in the middle; so a tone fades in at the bottom and out at the top, while the others rise through the middle: the endless rise'
        - type: oscillator
          id: 9
          parameters: {bandlimit: 1, color: 96, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 1, unison: 0}
          bind: {color: {p: 3, min: 64, max: 128}}
          comment: 'The tone: a triangle at timbre 0, a saw at 128'
        - type: mulp
          id: 10
          parameters: {stereo: 0}
        - type: pan
          id: 11
          parameters: {panning: 52, stereo: 0}
        - type: oscillator
          id: 12
          parameters: {bandlimit: 0, color: 128, detune: 64, gain: 128, lfo: 1, phase: 32, shape: 64, stereo: 0, transpose: 16, type: 1, unison: 0}
          bind: {color: 2, transpose: {p: 1, min: 0, max: 31}}
          comment: 'The rise of tone 2, a quarter of the cycle later: an octave higher'
        - type: send
          id: 13
          parameters: {amount: 76, port: 0, sendpop: 0, stereo: 0, target: 20, voice: 0}
        - type: push
          id: 14
          parameters: {stereo: 0}
        - type: mulp
          id: 15
          parameters: {stereo: 0}
        - type: loadval
          id: 16
          parameters: {stereo: 0, value: 0}
        - type: addp
          id: 17
          parameters: {stereo: 0}
        - type: push
          id: 18
          parameters: {stereo: 0}
        - type: mulp
          id: 19
          parameters: {stereo: 0}
        - type: oscillator
