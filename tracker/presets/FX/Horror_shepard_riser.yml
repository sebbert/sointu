          parameters: {bandlimit: 1, color: 96, detune: 64, gain: 128, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 1, unison: 0}
          bind: {color: {p: 3, min: 64, max: 128}}
        - type: mulp
