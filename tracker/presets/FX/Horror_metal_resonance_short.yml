name: Horror metal resonance short
comment: 'The struck metal shorter and harder: a pipe hit in a boiler room. Suggested notes: C-3 to C-5. Go synth and wasm player only. Velocity turns the level down (-6 dB at 64) and clank down.'
numvoices: 4
units:
    - type: velocity
      id: 1
      parameters: {stereo: 0}
      comment: 'Velocity: below 127 it turns clank down, by up to 48 steps at the softest...'
    - type: loadval
      id: 2
      parameters: {stereo: 0, value: 0}
    - type: addp
      id: 3
      parameters: {stereo: 0}
      comment: '(velocity - 1: 0 at full velocity, so that 127 plays the knob as set)'
    - type: send
      id: 4
      parameters: {amount: 88, port: 1, sendpop: 1, stereo: 0, target: 5, voice: 0}
      comment: '...here: amount 64 makes clank ignore velocity'
    - type: module
      id: 5
      parameters: {module: 1, p1: 16, p2: 112}
      comment: 'The Horror metal resonance module; its knobs: ring, clank'
    - type: velocity
      id: 6
      parameters: {stereo: 1}
      comment: 'Velocity: the level follows it, -6 dB at 64, -12 dB at 32; delete this and the mulp for a level that ignores velocity'
    - type: mulp
      id: 7
      parameters: {stereo: 1}
    - type: outaux
      id: 8
      parameters: {auxgain: 56, outgain: 75, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror metal resonance
      comment: 'A struck metal plate: inharmonic partials, the high ones dying first, and a clank. Stereo out. Curved envelopes and width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: ring, default: 64}
        - {name: clank, default: 64}
      units:
        - type: oscillator
          id: 1
          parameters: {bandlimit: 0, color: 64, detune: 62, gain: 80, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 0, unison: 0}
          comment: 'Partials of a struck plate: sines at 1.00, 1.59, 2.14, 2.83, 3.50, 4.67 times the note'
        - type: envelope
          id: 2
          parameters: {attack: 0, curve: 80, decay: 98, gain: 128, release: 100, stereo: 0, sustain: 0}
          bind: {decay: {p: 1, min: 88, max: 108}}
          comment: 'Each decays: the higher, the sooner. ring: how long'
        - type: mulp
          id: 3
          parameters: {stereo: 0}
        - type: pan
          id: 4
          parameters: {panning: 64, stereo: 0}
        - type: oscillator
          id: 5
          parameters: {bandlimit: 0, color: 64, detune: 68, gain: 60, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 72, type: 0, unison: 0}
        - type: envelope
          id: 6
          parameters: {attack: 0, curve: 80, decay: 94, gain: 128, release: 96, stereo: 0, sustain: 0}
          bind: {decay: {p: 1, min: 84, max: 104}}
        - type: mulp
          id: 7
          parameters: {stereo: 0}
        - type: pan
          id: 8
          parameters: {panning: 36, stereo: 0}
        - type: addp
