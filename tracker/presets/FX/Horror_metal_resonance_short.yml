          parameters: {stereo: 1}
        - type: oscillator
          id: 10
          parameters: {bandlimit: 0, color: 64, detune: 73, gain: 54, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 77, type: 0, unison: 0}
        - type: envelope
          id: 11
          parameters: {attack: 0, curve: 80, decay: 90, gain: 128, release: 92, stereo: 0, sustain: 0}
          bind: {decay: {p: 1, min: 80, max: 100}}
        - type: mulp
          id: 12
