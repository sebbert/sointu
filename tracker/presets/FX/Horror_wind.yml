name: Horror wind
comment: 'A cold wind around the house, howling in gusts. Hold the note. Knob: howl, how much it whistles. Go synth and wasm player only. Velocity turns the level down (-6 dB at 64) and howl down.'
numvoices: 1
units:
    - type: velocity
      id: 1
      parameters: {stereo: 0}
      comment: 'Velocity: below 127 it turns howl down, by up to 48 steps at the softest...'
    - type: loadval
      id: 2
      parameters: {stereo: 0, value: 0}
    - type: addp
      id: 3
      parameters: {stereo: 0}
      comment: '(velocity - 1: 0 at full velocity, so that 127 plays the knob as set)'
    - type: send
      id: 4
      parameters: {amount: 88, port: 0, sendpop: 1, stereo: 0, target: 5, voice: 0}
      comment: '...here: amount 64 makes howl ignore velocity'
    - type: module
      id: 5
      parameters: {module: 1, p1: 72}
      comment: 'The Horror wind module; its knobs: howl'
    - type: velocity
      id: 6
      parameters: {stereo: 1}
      comment: 'Velocity: the level follows it, -6 dB at 64, -12 dB at 32; delete this and the mulp for a level that ignores velocity'
    - type: mulp
      id: 7
      parameters: {stereo: 1}
    - type: outaux
      id: 8
      parameters: {auxgain: 30, outgain: 61, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror wind
      comment: 'Wind: noise through a resonant band that rises and falls in gusts. Stereo out. width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: howl, default: 64}
      units:
        - type: noise
          id: 1
          parameters: {gain: 128, shape: 64, stereo: 1}
          comment: 'Wind: noise'
        - type: filter
          id: 2
          parameters: {bandpass: 1, frequency: 30, highpass: 0, lowpass: 0, resonance: 42, stereo: 1}
          bind: {resonance: {p: 1, min: 60, max: 24}}
          comment: 'howl: a resonant band, which whistles more as howl rises'
        - type: noise
          id: 3
          parameters: {gain: 128, shape: 64, stereo: 0}
          comment: The howl rises and falls with the gusts
        - type: filter
          id: 4
          parameters: {bandpass: 0, frequency: 2, highpass: 0, lowpass: 1, resonance: 128, stereo: 0}
          comment: ...low-passed at 1.7 Hz...
        - type: dbgain
          id: 5
          parameters: {decibels: 121, stereo: 0}
          comment: ...and raised to a useful level
        - type: send
          id: 6
          parameters: {amount: 84, port: 0, sendpop: 1, stereo: 0, target: 2, voice: 0}
        - type: noise
          id: 7
          parameters: {gain: 128, shape: 64, stereo: 0}
          comment: The gusts...
        - type: filter
          id: 8
          parameters: {bandpass: 0, frequency: 3, highpass: 0, lowpass: 1, resonance: 128, stereo: 0}
          comment: ...low-passed at 3.9 Hz...
        - type: dbgain
          id: 9
          parameters: {decibels: 117, stereo: 0}
          comment: ...and raised to a useful level
        - type: send
          id: 10
          parameters: {amount: 96, port: 0, sendpop: 1, stereo: 0, target: 11, voice: 0}
        - type: loadval
          id: 11
          parameters: {stereo: 1, value: 96}
        - type: mulp
          id: 12
          parameters: {stereo: 1}
        - type: filter
          id: 13
          parameters: {bandpass: 0, frequency: 10, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
          comment: Low cut
        - type: envelope
          id: 14
          parameters: {attack: 92, curve: 0, decay: 80, gain: 128, release: 96, stereo: 1, sustain: 128}
          comment: 'swell is the fade in, release the fade out after the note'
        - type: mulp
          id: 15
          parameters: {stereo: 1}
        - type: filter
          id: 16
          parameters: {bandpass: 0, frequency: 116, highpass: 0, lowpass: 1, resonance: 128, stereo: 1}
          comment: High cut
        - type: width
          id: 17
          parameters: {lowcut: 19, width: 40}
