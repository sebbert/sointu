name: Horror riser cluster
comment: 'A dissonant riser: a cluster of saws climbing 12 semitones in 8 s while it opens and swells; release the note where the hit comes. Suggested notes: C-2 to C-4. Knobs: length is the time of the rise (8 s at 98), rise how far it climbs. Go synth and wasm player only. Velocity turns the level down (-6 dB at 64).'
numvoices: 1
units:
    - type: module
      id: 1
      parameters: {module: 1, p1: 98, p2: 64}
      comment: 'The Horror cluster riser module; its knobs: length, rise'
    - type: velocity
      id: 2
      parameters: {stereo: 1}
      comment: 'Velocity: the level follows it, -6 dB at 64, -12 dB at 32; delete this and the mulp for a level that ignores velocity'
    - type: mulp
      id: 3
      parameters: {stereo: 1}
    - type: outaux
      id: 4
      parameters: {auxgain: 31, outgain: 49, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror cluster riser
      comment: 'A cluster of saws rising in pitch while a filter opens, noise grows and the level swells, ending at the note off. Stereo out. Bandlimited oscillators, ladder, softclip and width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: length, default: 98}
        - {name: rise, default: 64}
      units:
        - type: envelope
          id: 1
          parameters: {attack: 98, curve: 0, decay: 64, gain: 128, release: 64, stereo: 0, sustain: 128}
          bind: {attack: 1}
          comment: 'The rise: from 0 to 1 over length (8 s at 98), then stays'
        - type: push
          id: 2
          parameters: {stereo: 0}
        - type: send
          id: 3
          parameters: {amount: 70, port: 0, sendpop: 0, stereo: 0, target: 8, voice: 0}
          bind: {amount: {p: 2, min: 64, max: 76}}
        - type: send
          id: 4
          parameters: {amount: 70, port: 0, sendpop: 0, stereo: 0, target: 9, voice: 0}
          bind: {amount: {p: 2, min: 64, max: 76}}
        - type: send
          id: 5
          parameters: {amount: 70, port: 0, sendpop: 1, stereo: 0, target: 11, voice: 0}
          bind: {amount: {p: 2, min: 64, max: 76}}
          comment: 'rise: how far the cluster rises, up to 24 semitones (12 at 64)'
        - type: send
          id: 6
          parameters: {amount: 88, port: 0, sendpop: 0, stereo: 0, target: 16, voice: 0}
          comment: The filter opens with the rise
        - type: send
          id: 7
          parameters: {amount: 96, port: 1, sendpop: 1, stereo: 0, target: 13, voice: 0}
          comment: and the noise grows
        - type: oscillator
          id: 8
          parameters: {bandlimit: 1, color: 128, detune: 74, gain: 24, lfo: 0, phase: 0, shape: 64, stereo: 1, transpose: 64, type: 1, unison: 2}
          comment: 'Saws: the note, a semitone and a whole tone above'
        - type: oscillator
          id: 9
          parameters: {bandlimit: 1, color: 128, detune: 56, gain: 24, lfo: 0, phase: 40, shape: 64, stereo: 1, transpose: 65, type: 1, unison: 2}
        - type: addp
          id: 10
          parameters: {stereo: 1}
        - type: oscillator
          id: 11
          parameters: {bandlimit: 1, color: 128, detune: 72, gain: 24, lfo: 0, phase: 80, shape: 64, stereo: 1, transpose: 66, type: 1, unison: 2}
        - type: addp
          id: 12
          parameters: {stereo: 1}
        - type: noise
          id: 13
          parameters: {gain: 0, shape: 64, stereo: 1}
          comment: Noise that grows with the rise
        - type: filter
          id: 14
          parameters: {bandpass: 1, frequency: 80, highpass: 0, lowpass: 0, resonance: 64, stereo: 1}
        - type: addp
          id: 15
          parameters: {stereo: 1}
        - type: ladder
          id: 16
          parameters: {drive: 24, frequency: 18, resonance: 48, stereo: 1}
          comment: 'Closed at the start, open at the end of the rise'
        - type: filter
          id: 17
          parameters: {bandpass: 0, frequency: 10, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
          comment: Low cut
        - type: envelope
          id: 18
          parameters: {attack: 98, curve: 0, decay: 64, gain: 128, release: 56, stereo: 1, sustain: 128}
          bind: {attack: 1}
        - type: push
          id: 19
          parameters: {stereo: 1}
        - type: mulp
          id: 20
          parameters: {stereo: 1}
          comment: 'The level grows with the square of the rise: slowly, then fast'
        - type: mulp
          id: 21
          parameters: {stereo: 1}
        - type: softclip
          id: 22
          parameters: {drive: 8, knee: 72, oversample: 0, stereo: 1}
        - type: width
          id: 23
          parameters: {lowcut: 19, width: 60}
