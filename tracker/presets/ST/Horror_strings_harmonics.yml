name: Horror strings harmonics
comment: 'Violin harmonics, flautando: pale, airy, nearly pure tones, wide. Suggested notes: C-5 to C-7, sustained. Knobs: air is the bow noise, dissonance adds a faint tritone, vibrato its depth. Width: Go synth and wasm player only.'
numvoices: 6
units:
    - type: module
      id: 1
      parameters: {module: 1, p1: 48, p2: 0, p3: 64, p4: 84, p5: 88}
      comment: 'The Horror harmonics strings module; its knobs: air, dissonance, vibrato, attack, release'
    - type: outaux
      id: 2
      parameters: {auxgain: 9, outgain: 15, stereo: 1}
      comment: 'auxgain sends it to the hall of Global horror space (aux 2/3); as loud as outgain, the hall is about as loud as the dry sound'
modules:
    - id: 1
      name: Horror harmonics strings
      comment: 'Violins playing harmonics flautando: near sines, airy bow noise, a shallow vibrato. Stereo out. width: Go synth and wasm player only.'
      inputs: 0
      params:
        - {name: air, default: 48}
        - {name: dissonance, default: 0}
        - {name: vibrato, default: 64}
        - {name: attack, default: 84}
        - {name: release, default: 88}
      units:
        - type: oscillator
          id: 1
          parameters: {bandlimit: 0, color: 64, detune: 65, gain: 60, lfo: 0, phase: 0, shape: 64, stereo: 1, transpose: 64, type: 0, unison: 1}
          comment: 'Flautando harmonics: almost sines, two a side, slightly apart'
        - type: oscillator
          id: 2
          parameters: {bandlimit: 0, color: 64, detune: 63, gain: 16, lfo: 0, phase: 40, shape: 64, stereo: 1, transpose: 76, type: 1, unison: 1}
          comment: 'and the octave, a triangle'
        - type: addp
          id: 3
          parameters: {stereo: 1}
        - type: oscillator
          id: 4
          parameters: {bandlimit: 0, color: 64, detune: 64, gain: 128, lfo: 1, phase: 0, shape: 64, stereo: 0, transpose: 81, type: 0, unison: 0}
          comment: 'A slow, shallow vibrato'
        - type: send
          id: 5
          parameters: {amount: 68, port: 1, sendpop: 0, stereo: 0, target: 1, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 72}}
        - type: send
          id: 6
          parameters: {amount: 68, port: 1, sendpop: 1, stereo: 0, target: 2, voice: 0}
          bind: {amount: {p: 3, min: 64, max: 72}}
        - type: oscillator
          id: 7
          parameters: {bandlimit: 0, color: 64, detune: 60, gain: 0, lfo: 0, phase: 0, shape: 64, stereo: 1, transpose: 70, type: 0, unison: 1}
          bind: {gain: {p: 2, min: 0, max: 36}}
          comment: 'dissonance: a tritone above'
        - type: addp
          id: 8
          parameters: {stereo: 1}
        - type: noise
          id: 9
          parameters: {gain: 15, shape: 64, stereo: 1}
          bind: {gain: {p: 1, min: 0, max: 40}}
          comment: 'Bow noise: the hiss of the hair on the strings'
        - type: filter
          id: 10
          parameters: {bandpass: 1, frequency: 100, highpass: 0, lowpass: 0, resonance: 64, stereo: 1}
          comment: 'a band of it, around the brightness of the strings'
        - type: addp
          id: 11
          parameters: {stereo: 1}
        - type: filter
          id: 12
          parameters: {bandpass: 0, frequency: 20, highpass: 1, lowpass: 0, resonance: 128, stereo: 1}
          comment: Low cut at 180 Hz
        - type: envelope
          id: 13
          parameters: {attack: 84, curve: 0, decay: 80, gain: 128, release: 88, stereo: 1, sustain: 128}
          bind: {attack: 4, release: 5}
          comment: 'swell is the fade in, release the fade out after the note'
        - type: mulp
          id: 14
          parameters: {stereo: 1}
        - type: width
          id: 15
          parameters: {lowcut: 19, width: 60}
