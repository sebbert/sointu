name: Hard techno screech acid
comment: 'An acid screech: one saw through a ladder at the edge of self-oscillation, snapped open by a short envelope, then the distortion and the reverb into a second distortion. A 303 played in a warehouse. Play it at C-3 to C-5, in 16ths. Mono at its core, with the reverb and the highs wide; high-passed above the kick and the bass. Distortion and reverb: Go synth and wasm player only.'
numvoices: 3
units:
    - type: oscillator
      id: 1
      parameters: {bandlimit: 1, color: 128, detune: 64, gain: 110, lfo: 0, phase: 0, shape: 64, stereo: 0, transpose: 64, type: 1, unison: 0}
      comment: 'One saw'
    - type: envelope
      id: 2
      parameters: {attack: 4, curve: 0, decay: 62, gain: 128, release: 56, stereo: 0, sustain: 96}
      comment: 'The level of the note'
    - type: mulp
      id: 3
      parameters: {stereo: 0}
    - type: envelope
      id: 4
      parameters: {attack: 0, curve: 48, decay: 60, gain: 128, release: 62, stereo: 0, sustain: 8}
      comment: 'The filter sweep: decay is how fast it closes, sustain where it stays'
    - type: send
      id: 5
      parameters: {amount: 94, port: 0, sendpop: 1, stereo: 0, target: 6, voice: 0}
      comment: 'How far the sweep opens the ladder'
    - type: ladder
      id: 6
      parameters: {drive: 64, frequency: 28, resonance: 110, stereo: 0}
      comment: 'A resonant low-pass, opened by the sweep'
    - type: dbgain
      id: 7
      parameters: {decibels: 80, stereo: 0}
      comment: 'Drive into the first distortion'
    - type: softclip
      id: 8
      parameters: {drive: 96, knee: 32, oversample: 1, stereo: 0}
      comment: 'Distortion 1, oversampled'
    - type: pan
      id: 9
      parameters: {panning: 64, stereo: 0}
      comment: 'To both sides'
    - type: push
      id: 10
      parameters: {stereo: 1}
      comment: 'A copy for the reverb'
    - type: reverb
      id: 11
      parameters: {decay: 48, early: 52, earlywidth: 24, gain: 56, highcut: 104, highs: 72, lowcut: 72, lows: 32, mod: 24, modrate: 56, predelay: 0, size: 36, spread: 77, steps: 4, tailwidth: 48}
      comment: 'Reverb before the distortion: its tail is distorted with the note, the roar of a hard techno screech'
    - type: addp
      id: 12
      parameters: {stereo: 1}
      comment: 'The note and its reverb, into the distortion'
    - type: ladder
      id: 13
      parameters: {drive: 0, frequency: 56, resonance: 0, stereo: 1}
      comment: 'A low-pass before the peaks and the distortion: fewer harmonics above what can be played back, which would fold down as noise'
    - type: belleq
      id: 14
      parameters: {bandwidth: 14, frequency: 52, gain: 100, stereo: 1}
      comment: 'The scream: a peak before the distortion picks the harmonics that scream'
    - type: belleq
      id: 15
      parameters: {bandwidth: 20, frequency: 64, gain: 88, stereo: 1}
      comment: 'A second peak, the formant'
    - type: softclip
      id: 16
      parameters: {drive: 80, knee: 40, oversample: 1, stereo: 1}
      comment: 'Distortion 2, oversampled'
    - type: filter
      id: 17
      parameters: {bandpass: 0, frequency: 30, highpass: 1, lowpass: 0, resonance: 96, stereo: 1}
      comment: 'High-pass: the screech above the kick and the bass'
    - type: ott
      id: 18
      parameters: {depth: 80, downward: 128, high: 64, low: 64, mid: 64, stereo: 1, time: 64, upward: 128}
      comment: 'Multiband compression: dense, the highs and lows of the distortion even'
    - type: belleq
      id: 19
      parameters: {bandwidth: 32, frequency: 76, gain: 54, stereo: 1}
      comment: 'Tames the harshest band'
    - type: width
      id: 20
      parameters: {lowcut: 24, width: 96}
      comment: 'Width; mono below lowcut'
    - type: softclip
      id: 21
      parameters: {drive: 0, knee: 96, oversample: 1, stereo: 1}
      comment: 'The ceiling'
    - type: outaux
      id: 22
      parameters: {auxgain: 24, outgain: 52, stereo: 1}
      comment: 'outgain is the level; auxgain sends it to the reverb of the song'
