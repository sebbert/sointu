name: Club supersaw lead
comment: 'A supersaw lead: 16 detuned saws, 8 on each side, wide but mono below about 150 Hz. auxgain sends it to the reverb. Bandlimited oscillators, curved envelope, ladder and width: Go synth and wasm player only.'
numvoices: 4
units:
    - type: envelope
      id: 1
      parameters: {attack: 36, curve: 64, decay: 72, gain: 128, release: 62, stereo: 1, sustain: 96}
    - type: oscillator
      id: 2
      parameters: {bandlimit: 1, color: 128, detune: 80, gain: 24, lfo: 0, phase: 0, shape: 64, stereo: 1, transpose: 64, type: 1, unison: 3}
      comment: Four saws on each side; detune is the spread
    - type: oscillator
      id: 3
      parameters: {bandlimit: 1, color: 128, detune: 46, gain: 24, lfo: 0, phase: 76, shape: 64, stereo: 1, transpose: 64, type: 1, unison: 3}
      comment: 'Four more, detuned the other way and a little further, a good half cycle later: with phase 76 the two sides are about equally loud from the start of a note, which one detuned oscillator alone is not'
    - type: addp
      id: 4
      parameters: {stereo: 1}
    - type: mulp
      id: 5
      parameters: {stereo: 1}
    - type: ladder
      id: 6
      parameters: {drive: 0, frequency: 112, resonance: 16, stereo: 1}
      comment: 'Cutoff: automate frequency for the classic trance sweep'
    - type: width
      id: 7
      parameters: {lowcut: 19, width: 48}
      comment: 'Width, and mono below lowcut'
    - type: outaux
      id: 8
      parameters: {auxgain: 24, outgain: 64, stereo: 1}
